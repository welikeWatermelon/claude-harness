name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false # 한 OS 가 실패해도 다른 OS 결과를 끝까지 보기
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: lib 동기화 확인
        run: node scripts/sync-lib.mjs --check
      - name: 테스트
        run: node --test tests/rules.test.mjs tests/hooks.test.mjs
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: for p in plugins/*; do claude plugin validate "$p" --strict; done
